#!/usr/bin/env -S stimela run

_include:
  - lightcurve-cabs.yml
  - flagging/meerkat_1k_basic.yml

## this augments the standard 'opts' config section to tweak logging settings
opts:
  log:
    dir: logs/log-{config.run.datetime}
    name: log-{info.fqname}
    nest: 2
    symlink: log
  backend:
    select: singularity
    rlimits:
      NOFILE: 100000  # set high limit on number of open files

delaycal:
  name: delaycal
  info: |
    Derive 1GC solutions from a delaycal observation of a primary calibrator.
    Flags the data, predicts the calibrator model and solves for amplitudes,
    phases, delays and the bandpass with QuartiCal. Currently tailored for
    processing MeerKAT L1 visibilities averaged down to 1k.

  assign:
    # Redirect logs to the output directory.
    log.dir: '{recipe.outdir-path}/logs/log-{config.run.datetime}'

  inputs:
    ms-path:
      info: Path to input Measurement Set.
      dtype: MS
      required: true
    band:
      info: |
        Set the observing band which is used to automatically configure
        certain parameters.
      dtype: str
      choices: [L, UHF]
      required: true

    threads:
      info: |
        Number of threads to use in general. The more specific
        calibration-threads input takes priority over this value where set.
      dtype: int
      default: 1
    calibration-threads:
      info: |
        Number of threads to use for calibration steps. Applies to QuartiCal
        and sets the number of Dask threads.
      dtype: Optional[int]
      default:  # The default will evaluate to None, making logic simpler.

  outputs:
    outdir-path:
      info: |
        Path to the output directory in which the recipe should store its
        results.
      dtype: Directory
      required: true
      writable: true
      path_policies:
        mkdir_parent: true

  steps:
    basic-flagging:
      info: |
        Run a basic flagging subrecipe, based on Oxkat, which will flag known
        RFI bands and do a basic tricolour run (which assumes that the data has
        been averaged down to 1024 channels). The subrecipe will back up the
        original flags before running.
      recipe: meerkat-target-flagging
      skip_if_outputs: exist
      params:
        ms-path: =recipe.ms-path
        band: =recipe.band

    flag-reset:
      info: |
        Restore the flags to their state after the inital flagging step. The
        basic-flagging step must have been run once for this step to work.
      cab: casa.flagman.restore
      params:
        ms: =recipe.ms-path
        versionname: =previous.updated-flag-versionname

    flagsummary-1:
      info: |
        Use casa to generate a summary of the flags on the dataset.
      cab: casa.flagsummary
      params:
        ms: =recipe.ms-path

    extract-field-name:
      info: |
        Extract that name of the calibrator observed during the delaycal.
      cab: extract-field-name
      params:
        ms-path: =recipe.ms-path

    set-model:
      cab: crystalball

      assign:
        model-source-name: =CASES(
            steps.extract-field-name.field-name == "J1939-6342", "PKS1934",
            steps.extract-field-name.field-name == "J0408-6545", "PKS0407",
            ERROR("No calibrator sky model for field " + steps.extract-field-name.field-name + ".")
          )
        model-band: =CASES(
            recipe.band == "UHF", "UBand",
            recipe.band == "L", "LBand"
          )
        model-identifier: "{recipe.model-source-name}.{recipe.model-band}"

      params:
        ms: =recipe.ms-path
        field: =steps.extract-field-name.field-name
        output-column: MODEL_DATA
        sky-model: ${self:dirname}/models/fitted.{recipe.model-identifier}.wsclean.cat.txt
        num-sources: 90
        num-workers: =recipe.threads

    cal-1:
      info: |
        Use quartical to perform 1GC. Solves for amplitudes, phases, residual delays and the
        bandpass. Currently runs per-scan on the input measurement set. This should be harmless,
        even in the case were the input contains both the uncorrected scan and the corrected
        scan - the interpolation should just use nearest neighbour interpolation from the corrected
        scan which appears second (closer to the coordinates of the data).
      cab: quartical
      params:
        input_ms:
          path: =recipe.ms-path
          select_uv_range: [100, 0]
          freq_chunk: 0
          time_chunk: 0
        input_model:
          recipe: MODEL_DATA
        solver:
          terms: [Ga,Gp,K,B]
          iter_recipe: [100,100,100,0,100,100,100,100]
        dask:
          threads: =recipe.calibration-threads or recipe.threads
        output:
          overwrite: true
          gain_directory: '{recipe.outdir-path}/{info.label}/gains.qc'
          log_directory: '{recipe.outdir-path}/{info.label}/logs.qc'
          products: [corrected_data]
          columns: [CORRECTED_DATA]
        mad_flags:
          enable: true
        Ga:
          type: amplitude
          time_interval: 0
          freq_interval: 0
        Gp:
          type: phase
          time_interval: 0
          freq_interval: 0
        K:
          time_interval: 0
          freq_interval: 0
          type: delay
        B:
          type: diag_complex
          time_interval: 0
          freq_interval: 1

    flagsummary-2:
      info: |
        Use casa to generate a summary of the flags on the dataset.
      cab: casa.flagsummary
      params:
        ms: =recipe.ms-path
