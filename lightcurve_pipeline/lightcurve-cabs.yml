_include:
  (cultcargo):
    - wsclean.yml
    - breizorro.yml
    - quartical.yml
    - taql.yml

cabs:
  debug-print:
    flavour: python-code
    command: |
      for arg in args:
        print(arg)
    inputs:
      args:
        dtype: List[Any]

  add-imaging-columns:
    flavour: python-code
    command: |
      import casacore.tables as pt
      pt.addImagingColumns(ms_path)
    inputs:
      ms-path:
        info: Path to the measurement set.
        dtype: MS
        policies:
          positional: true
        must_exist: true
        writable: true
