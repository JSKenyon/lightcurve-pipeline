[project]
name = "lightcurve-pipeline"
version = "0.0.0"
description = "Basic pipeline for post-1GC lightcurve extraction."
authors = [
    { name = "Jonathan Kenyon", email = "jonosken@gmail.com" },
    { name = "Joe Bright", email = "joe.bright@physics.ox.ac.uk" },
    { name = "Oleg Smirnov", email = "osmirnov@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "stimela",
    "cult-cargo",
    "breifast-tron",
]
requires-python = ">=3.10, <3.13"

[project.urls]
Repository = "https://github.com/JSKenyon/lightcurve-pipeline"

[tool.uv.sources]
stimela = { git = "ssh://git@github.com/caracal-pipeline/stimela.git", branch = "master" }
cult-cargo = { git = "ssh://git@github.com/caracal-pipeline/cult-cargo.git", branch = "master" }
breifast-tron = { git = "ssh://git@github.com/ratt-ru/breifast.git", branch = "master", subdirectory = "breifast-tron" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # To allow installation from github repos.
